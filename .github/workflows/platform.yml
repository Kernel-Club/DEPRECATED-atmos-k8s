name: Platform

# Installs what the app needs from the cluster, once after the cluster is created:
# namespaces, Gateway API CRDs, AWS Load Balancer Controller, GatewayClass, External Secrets.
# Safe to run again: it only upgrades what is already installed.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: platform
  cancel-in-progress: false

env:
  GATEWAY_API_VERSION: v1.6.0
  LB_CONTROLLER_VERSION: 3.6.2
  EXTERNAL_SECRETS_VERSION: 2.14.0

jobs:
  platform:
    name: Install the platform
    runs-on: ubuntu-latest
    # Waits for a reviewer. The AWS role of this environment has cluster admin rights.
    environment: platform

    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Connect kubectl to the cluster
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.PROJECT_NAME }}-eks"

      - name: Create namespaces
        run: |
          for ns in dev prod; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          done

      # The Load Balancer Controller needs these CRDs when it starts.
      - name: Install Gateway API CRDs
        run: |
          kubectl apply --server-side -f \
            "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"

      # The IAM role comes from Pod Identity (project-atmos-iac): service account name must match.
      - name: Install AWS Load Balancer Controller
        run: |
          cluster="${{ vars.PROJECT_NAME }}-eks"
          vpc_id=$(aws eks describe-cluster --name "$cluster" --query cluster.resourcesVpcConfig.vpcId --output text)
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --version "$LB_CONTROLLER_VERSION" -n kube-system \
            --set clusterName="$cluster" \
            --set region="${{ vars.AWS_REGION }}" \
            --set vpcId="$vpc_id" \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set controllerConfig.featureGates.ALBGatewayAPI=true \
            --set replicaCount=1 \
            --atomic --wait --timeout 5m

      # The name must match gateway.className in charts/atmos/values.yaml.
      - name: Create the GatewayClass
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: aws-alb
          spec:
            controllerName: gateway.k8s.aws/alb
          EOF

      # The service account is called external-secrets, as in Pod Identity.
      - name: Install External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --version "$EXTERNAL_SECRETS_VERSION" -n external-secrets --create-namespace \
            --atomic --wait --timeout 5m

      # New EKS clusters have no default StorageClass, so PVCs without a class stay Pending.
      # The EBS CSI driver is an EKS addon (project-atmos-iac).
      - name: Create the default StorageClass
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: gp3
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: ebs.csi.aws.com
          parameters:
            type: gp3
            encrypted: "true"
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
          allowVolumeExpansion: true
          EOF

      # The dev/prod deploy roles only have AmazonEKSEditPolicy, which does not cover CRDs.
      # Their access entries put them in the group "deployers" (project-atmos-iac).
      - name: Allow deploy roles to manage the chart's CRDs
        run: |
          for ns in dev prod; do
            kubectl apply -n "$ns" -f - <<'EOF'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: deployer-crds
          rules:
            - apiGroups: [external-secrets.io]
              resources: [externalsecrets, secretstores]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gateways, httproutes]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: [gateway.k8s.aws]
              resources: [loadbalancerconfigurations, targetgroupconfigurations]
              verbs: [get, list, watch, create, update, patch, delete]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: deployer-crds
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: deployer-crds
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: deployers
          EOF
          done

      - name: Check
        run: |
          kubectl get namespaces dev prod
          kubectl get storageclass gp3
          kubectl get rolebinding deployer-crds -n dev
          kubectl get rolebinding deployer-crds -n prod
          kubectl get gatewayclass aws-alb
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
          kubectl get pods -n external-secrets
