# Defaults for every environment; differences are in values-dev.yaml and values-prod.yaml.

# dev | prod. Part of the Secrets Manager path.
environment: dev

backend:
  image:
    # Repository and tag are set by CD. Required.
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

frontend:
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 5173
  servicePort: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

mongodb:
  image:
    repository: mongo
    tag: "8.0"
  port: 27017
  database: project_atmos
  persistence:
    size: 5Gi
    # Empty = the cluster default StorageClass
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

redis:
  image:
    repository: redis
    tag: "8.0"
  port: 6379
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Secret read by the pods: openweather-api-key, mongodb-username, mongodb-password.
secrets:
  name: atmos-secrets
  externalSecrets:
    # true: External Secrets Operator fills the Secret from AWS Secrets Manager.
    # false: create the Secret yourself (kind/minikube).
    enabled: true
    apiVersion: external-secrets.io/v1
    refreshInterval: 1h
    # Secrets Manager prefix (the project name). Required.
    remotePrefix: ""
    store:
      # Namespaced SecretStore; ESO logs in with its own Pod Identity role.
      create: true
      name: aws-secrets-manager
      kind: SecretStore
      # Required.
      region: ""

# External access: AWS ALB through Gateway API.
gateway:
  enabled: true
  className: aws-alb
  scheme: internet-facing
  # The GatewayClass is normally created by Terraform (project-atmos-iac, modules/platform).
  createGatewayClass: false

# Extra CORS origins for the backend (the browser uses a relative /api).
corsOrigins: []

podDisruptionBudget:
  enabled: false

autoscaling:
  backend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
