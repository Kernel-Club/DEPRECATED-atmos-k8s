{{- with .Values.secrets.externalSecrets }}
{{- if .enabled }}
{{- $prefix := required "secrets.externalSecrets.remotePrefix is required" .remotePrefix }}
{{- if .store.create }}
apiVersion: {{ .apiVersion }}
kind: SecretStore
metadata:
  name: {{ .store.name }}
  labels:
    {{- include "atmos.labels" $ | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "secrets.externalSecrets.store.region is required" .store.region }}
---
{{- end }}
apiVersion: {{ .apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $.Values.secrets.name }}
  labels:
    {{- include "atmos.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    name: {{ .store.name }}
    kind: {{ .store.kind }}
  target:
    name: {{ $.Values.secrets.name }}
    creationPolicy: Owner
  data:
    - secretKey: openweather-api-key
      remoteRef:
        key: {{ $prefix }}/{{ $.Values.environment }}/openweather-api-key
    - secretKey: mongodb-username
      remoteRef:
        key: {{ $prefix }}/{{ $.Values.environment }}/mongodb
        property: username
    - secretKey: mongodb-password
      remoteRef:
        key: {{ $prefix }}/{{ $.Values.environment }}/mongodb
        property: password
{{- end }}
{{- end }}
