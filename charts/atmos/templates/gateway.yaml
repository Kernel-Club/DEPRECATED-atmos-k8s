{{- if .Values.gateway.enabled }}
{{- $fullname := include "atmos.fullname" . }}
{{- if .Values.gateway.createGatewayClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
spec:
  controllerName: gateway.k8s.aws/alb
---
{{- end }}
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "atmos.labels" . | nindent 4 }}
spec:
  scheme: {{ .Values.gateway.scheme }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "atmos.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: {{ $fullname }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# The ALB sends traffic straight to pod IPs.
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "atmos.labels" . | nindent 4 }}
spec:
  targetReference:
    name: {{ $fullname }}-frontend
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "atmos.labels" . | nindent 4 }}
spec:
  targetReference:
    name: {{ $fullname }}-backend
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /health
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "atmos.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $fullname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ $fullname }}-backend
          port: {{ .Values.backend.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullname }}-frontend
          port: {{ .Values.frontend.servicePort }}
{{- end }}
